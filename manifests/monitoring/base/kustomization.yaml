apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - rules/node.yaml
  - rules/platform.yaml
  - rules/demo.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Homelab
configMapGenerator:
  - name: dashboard-cluster-overview
    files:
      - dashboards/cluster-overview.json
  - name: dashboard-demo-red
    files:
      - dashboards/demo-red.json
  - name: dashboard-gitops
    files:
      - dashboards/gitops.json
