apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-nodes
spec:
  groups:
    - name: homelab.nodes
      rules:
        - alert: NodeDiskFillingUp
          expr: |
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"}
            ) < 0.15
            and predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"}[6h], 24 * 3600) < 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Root filesystem on {{ $labels.instance }} will fill within 24h"
            description: "{{ $labels.instance }} has {{ $value | humanizePercentage }} free and is trending to zero."
        - alert: NodeMemoryPressure
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Memory above 90% on {{ $labels.instance }}"
            description: "Sustained memory use of {{ $value | humanizePercentage }}."
        - alert: NodeHighCPU
          expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
          for: 20m
          labels:
            severity: info
          annotations:
            summary: "CPU above 90% on {{ $labels.instance }}"
