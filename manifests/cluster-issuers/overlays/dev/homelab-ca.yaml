# Dev has no public DNS; a cluster-local CA signs every ingress certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-dev-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab-dev-ca
  secretName: homelab-dev-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: default
spec:
  ca:
    secretName: homelab-dev-ca
