apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: podinfo
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: PodDisruptionBudget
      name: podinfo
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: Ingress
      name: podinfo
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: demo.dev.lab.example.com
      - op: replace
        path: /spec/rules/0/host
        value: demo.dev.lab.example.com
  - target:
      kind: Deployment
      name: podinfo
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/command/3
        value: --level=debug
