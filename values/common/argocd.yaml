global:
  domain: argocd.lab.example.com

configs:
  params:
    server.insecure: true
    application.namespaces: ""
  cm:
    admin.enabled: true
    exec.enabled: false
    timeout.reconciliation: 180s
    kustomize.buildOptions: --enable-helm
    # Restore Application health so sync waves in the app-of-apps wait for children.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
  rbac:
    policy.default: role:readonly

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: default
    tls: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

notifications:
  enabled: false

dex:
  enabled: false
