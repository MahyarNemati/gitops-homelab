name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yaml lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx install yamllint
      - run: yamllint --strict .

  kustomize:
    name: overlays build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        overlay:
          - apps/overlays/dev
          - apps/overlays/prod
          - manifests/demo/overlays/dev
          - manifests/demo/overlays/prod
          - manifests/monitoring/overlays/dev
          - manifests/monitoring/overlays/prod
          - manifests/cluster-issuers/overlays/dev
          - manifests/cluster-issuers/overlays/prod
    steps:
      - uses: actions/checkout@v5
      - uses: imranismail/setup-kustomize@v2
      # A kustomization that does not build is a cluster that will not sync, and
      # Argo CD would be the thing to discover it. Catch it here instead.
      - name: kustomize build ${{ matrix.overlay }}
        run: kustomize build --enable-helm ${{ matrix.overlay }} > /dev/null

  kubeconform:
    name: manifests validate against kubernetes schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: imranismail/setup-kustomize@v2
      - name: Install kubeconform
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      # CRDs (Argo CD Applications, ServiceMonitors, cert-manager issuers,
      # SealedSecrets) are not in the stock Kubernetes schemas, so pull the
      # community CRD catalogue as an extra schema location and skip only what
      # is genuinely unresolvable.
      - name: Validate every overlay
        run: |
          set -euo pipefail
          CRD='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for overlay in \
            apps/overlays/dev apps/overlays/prod \
            manifests/demo/overlays/dev manifests/demo/overlays/prod \
            manifests/monitoring/overlays/dev manifests/monitoring/overlays/prod \
            manifests/cluster-issuers/overlays/dev manifests/cluster-issuers/overlays/prod
          do
            echo "::group::$overlay"
            kustomize build --enable-helm "$overlay" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -kubernetes-version 1.31.0 -schema-location default -schema-location "$CRD"
            echo "::endgroup::"
          done

  dashboards:
    name: grafana dashboards are valid json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-dashboards.py

  promtool:
    name: prometheus rules check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyyaml
      - name: Install promtool
        run: |
          curl -sSfL -o prom.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.1.0/prometheus-3.1.0.linux-amd64.tar.gz
          tar xzf prom.tar.gz --strip-components=1 prometheus-3.1.0.linux-amd64/promtool
          sudo install -m 0755 promtool /usr/local/bin/promtool
      - run: python3 scripts/check-rules.py

  opentofu:
    name: opentofu fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.2
      - name: fmt
        run: tofu -chdir=terraform fmt -check -recursive
      - name: validate
        run: |
          tofu -chdir=terraform init -backend=false
          tofu -chdir=terraform validate
